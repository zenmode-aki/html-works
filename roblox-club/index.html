<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Roblox Club</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 28px 18px; color: #302b50; background: #eff4ff; background-image: linear-gradient(#dfe7fc 1px, transparent 1px), linear-gradient(90deg, #dfe7fc 1px, transparent 1px); background-size: 28px 28px; font-family: system-ui, sans-serif; font-weight: 600; }
    main { width: min(100%, 660px); padding: clamp(24px, 6vw, 48px); background: #fffdf5; border: 4px solid #302b50; border-radius: 24px; box-shadow: 8px 8px 0 #b7b0ed; }
    .blocks { display: flex; gap: 9px; margin-bottom: 24px; }
    .blocks span { width: 26px; height: 26px; border: 3px solid #302b50; border-radius: 6px; background: #b8e8ca; box-shadow: 0 4px 0 #302b50; }
    .blocks span:nth-child(2) { background: #ffcf8d; transform: translateY(-6px); }
    .blocks span:nth-child(3) { background: #d3c5fa; }
    time { display: inline-block; padding: 7px 12px; border: 2px solid #302b50; border-radius: 8px; background: #fff0be; font-size: .9rem; }
    p { font-size: clamp(1.15rem, 3vw, 1.4rem); line-height: 1.9; word-break: keep-all; overflow-wrap: anywhere; }
    .translation { margin-top: 28px; padding-top: 22px; border-top: 3px dashed #c9c0e7; }
    .translation-label { margin: 0 0 8px; font-size: .95rem; color: #574577; }
    .translation p:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <div class="blocks" aria-hidden="true"><span></span><span></span><span></span></div>
    <time datetime="2026-10-31">October 31, 2026</time>
    <p>안녕하세요. 오늘부터 가끔 블로그에 글을 올릴게요. 요즘 저는 Roblox에 푹 빠져 있어요. Roblox에서 한국 클럽을 만들어 보고 있어요.</p>
    <section class="translation" lang="en" aria-label="English translation">
      <p class="translation-label">(translation)</p>
      <p>Hello. Starting today, I will post on the blog from time to time. These days, I am really into Roblox. I am trying to create a Korean club in Roblox.</p>
    </section>
  </main>
</body>
</html>
