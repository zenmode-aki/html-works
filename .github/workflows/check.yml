# push のたびに、記事とサイトの約束ごとを自動で検査する。
#
# Claude と ChatGPT/Codex の両方がこのリポジトリに push するので、
# 「片方が検査を忘れたまま公開してしまう」のをここで止める。
#
# ⚠️ tools/thumbs.py は macOS の sips を使うので、ここでは走らせない。
#    サムネ画像そのものはローカルで作って commit する。

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 記事（words・バッジ・見出しラベル・SOURCE MAP）
        run: python3 tools/check.py

      - name: サイト全体（バッジ・noindex・meta.json・サムネ・死んだリンク）
        run: python3 tools/check.py --site

      # index.html の記事一覧は手で書かず build-site.py で差し込む決まり。
      # 差し込み直して差分が出たら、誰かが手で足したか、差し込み忘れている。
      - name: トップページの一覧が最新かどうか
        run: |
          python3 tools/build-site.py
          if ! git diff --exit-code -- index.html; then
            echo ""
            echo "❌ トップページの記事一覧が最新ではありません。"
            echo "   POSTS と PLACES は手で編集せず、"
            echo "   python3 tools/build-site.py で差し込み直して commit してください。"
            exit 1
          fi
          echo "✅ トップページの一覧は最新です"
