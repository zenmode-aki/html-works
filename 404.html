<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Page not found · Pengesso</title>
<!-- 🐧 見つからないページ（2026-09-26）。GitHub Pages は、無いURLを開くとこのファイルを出す。
     どのURLで出るかわからないので、画像やリンクは必ず「/」から始める -->
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png" />
<style>
  :root { --navy: #232c48; --blue: #2f56c9; --yellow: #ffc42e; --cream: #f6efe3; --paper: #fffdf8; --ink: #1b2138; --muted: #5d6583; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(circle at 10% 0%, rgba(86,124,240,.16), transparent 40%),
                radial-gradient(circle at 95% 90%, rgba(255,196,46,.20), transparent 40%), var(--cream);
    color: var(--ink); font-family: "Arial Rounded MT Bold", "Avenir Next Rounded", "Hiragino Maru Gothic ProN", "Trebuchet MS", sans-serif;
    font-weight: 800;
  }
  main {
    width: min(460px, 100%); padding: 30px 24px 26px; text-align: center; border-radius: 30px;
    background: var(--paper); box-shadow: 0 18px 50px rgba(35,44,72,.15); border: 2px solid rgba(255,255,255,.9);
  }
  .pen { width: 150px; height: 150px; margin: 0 auto 6px; border-radius: 28px; overflow: hidden; transform: rotate(-4deg);
         box-shadow: 0 12px 26px rgba(35,44,72,.2); animation: look 3.2s ease-in-out infinite; }
  .pen img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @keyframes look { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .code { margin: 18px 0 0; color: var(--blue); font-size: 13px; font-weight: 900; letter-spacing: .2em; }
  h1 { margin: 8px 0 0; font-size: clamp(26px, 7vw, 34px); line-height: 1.2; letter-spacing: -.02em; }
  .ja { margin: 6px 0 0; color: var(--muted); font-size: 16px; }
  p.say { margin: 16px 0 0; line-height: 1.6; font-size: 16px; }
  p.say span { display: block; color: var(--muted); font-size: 14.5px; }
  .btns { display: grid; gap: 10px; margin-top: 22px; }
  a.btn { display: block; min-height: 48px; padding: 12px 18px; border-radius: 999px; text-decoration: none; font-size: 15.5px; font-weight: 900;
          transition: transform .15s ease; }
  a.btn:hover { transform: translateY(-2px); }
  a.btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  a.btn small { display: block; margin-top: 3px; font-size: 12.5px; opacity: .8; }
  [lang="ja"] { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-weight: 700; }
  .main { background: var(--yellow); color: #3b2600; box-shadow: 0 5px 0 #d99a00; }
  .sub { background: #eef1fb; color: var(--navy); }
  html[data-theme="dark"] body { background: #15161d; color: #ece8f3; }
  html[data-theme="dark"] main { background: #22242f; border-color: rgba(255,255,255,.08); }
  html[data-theme="dark"] .ja, html[data-theme="dark"] p.say span { color: #c4bcd4; }
  html[data-theme="dark"] .code { color: #9db4ff; }
  html[data-theme="dark"] .sub { background: #2f3244; color: #f4f0fa; }
  @media (prefers-reduced-motion: reduce) { .pen { animation: none; } a.btn { transition: none; } }
</style>
<script>
  // サイトのほかのページと同じく、🌙 を選んでいた人にはダークで出す
  try { if (localStorage.getItem('pengesso-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body>
<main>
  <div class="pen"><img src="/assets/pengesso/pengesso-01.jpg" alt="Pengesso, a plush penguin in a blue cap and sunglasses" /></div>
  <div class="code">404 · NOT FOUND</div>
  <h1>This page is not here.</h1>
  <div class="ja" lang="ja">このページは、見つかりませんでした。</div>
  <p class="say">Maybe the penguin moved it.
    <span lang="ja">ペンギンがどこかへ持っていったのかもしれません。</span></p>
  <div class="btns">
    <a class="btn main" href="/">🐧 Go to the top<small lang="ja">トップへ</small></a>
    <a class="btn sub" href="/#find">🗺️ Pick a place on the map<small lang="ja">地図から選ぶ</small></a>
  </div>
</main>
</body>
</html>
