<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- 👇 差し替える -->
<title>__SLUG__</title>
<style>
  /* ⚡ 色は記事ごとに変えていい。トーン反転ルール（PROMPT.md）に従うこと。
     真面目な話 → ポップに。どうでもいい話 → 荘厳に。 */
  :root {
    --bg: #fff7fb;
    --card: rgba(255,255,255,.94);
    --text: #322536;
    --muted: #876f84;
    --pink: #ff6fae;
    --purple: #8b6de8;
    --line: rgba(91,52,103,.12);
    --shadow: 0 20px 55px rgba(115,70,111,.16);
    --round: 28px;
  }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    color: var(--text);
    font-family: "Arial Rounded MT Bold", "Avenir Next Rounded", "Trebuchet MS", sans-serif;
    background:
      radial-gradient(circle at 8% 4%,   rgba(255,212,92,.33),  transparent 24%),
      radial-gradient(circle at 96% 14%, rgba(255,111,174,.20), transparent 27%),
      radial-gradient(circle at 50% 100%,rgba(101,214,189,.16), transparent 35%),
      var(--bg);
  }

  main { width: min(720px, calc(100% - 24px)); margin: 0 auto; padding: 22px 0 70px; }

  /* ── 上のバー：戻る導線 と ワード数バッジ ───────────────── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px; margin-bottom: 20px;
  }
  .home {
    display: inline-block; min-height: 44px; padding: 12px 18px;
    border-radius: 999px; background: #fff; color: var(--purple);
    border: 2px solid rgba(255,255,255,.9);
    font-size: 14px; text-decoration: none;
    box-shadow: 0 6px 16px rgba(115,70,111,.10);
  }
  .home:hover { transform: translateY(-2px); }

  .badges { display: flex; align-items: center; gap: 8px; }
  /* ⚡ 読者への親切であり、AIが盛っていないことの証拠でもある */
  .wc-badge {
    padding: 10px 16px; border-radius: 999px;
    background: #fff; border: 2px solid rgba(255,255,255,.9);
    color: var(--muted); font-size: 13px; letter-spacing: .04em;
    box-shadow: 0 6px 16px rgba(115,70,111,.08);
  }

  /* ── 🚦 公開ずみの印を右上に必ず出す ────────────────────────
     出す場所は works/ の1つだけなので、記事はぜんぶ PUBLIC。
     2026-09-04 に本番前（staging/）をやめたので STAGING はもう無い。
     tools/check.py --site が「STAGING が残っていないか」を見ている */
  .stage {
    padding: 10px 13px; border-radius: 999px;
    font-size: 11px; font-weight: 900; letter-spacing: .12em;
    white-space: nowrap; box-shadow: 0 6px 16px rgba(115,70,111,.16);
  }
  .stage-public { background: #23c98a; color: #04331d; }

  .label {
    color: var(--purple); font-size: 13px; font-weight: 800;
    letter-spacing: .14em; margin-bottom: 16px;
  }

  h1 {
    margin: 0 0 22px; color: #3b2745;
    font-size: clamp(34px, 6.6vw, 60px); line-height: 1.06;
    letter-spacing: -.05em; text-wrap: balance;
    text-shadow: 0 4px 0 rgba(255,255,255,.75);
  }

  /* ── 写真（base64で埋め込む。tools/embed.py がやる）─────────── */
  .photo {
    margin: 0 0 24px; overflow: hidden; background: #f3e9f2;
    border: 7px solid rgba(255,255,255,.78); border-radius: 32px;
    box-shadow: var(--shadow); transform: rotate(-.35deg);
  }
  .photo img { display: block; width: 100%; height: auto; }

  /* ── 本文カード：15秒版は 3〜5枚まで。1枚に1〜2文 ──────────── */
  .card {
    position: relative; margin-top: 18px; padding: 24px 26px;
    background: var(--card); border: 2px solid rgba(255,255,255,.92);
    border-radius: var(--round); box-shadow: 0 12px 32px rgba(115,70,111,.09);
    backdrop-filter: blur(8px);
  }

  /* ── カードの見出し：絵文字だけにしない。英単語2〜3語を必ず付ける ──
     🧠 THE PROBLEM  /  ⚡ ONE FIX  /  🎯 SO WHAT
     tools/check.py が card の枚数と card-label の数を照合している */
  .card-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  }
  .card-emoji { font-size: 26px; line-height: 1; }
  .card-label {
    font-size: 12.5px; font-weight: 900; letter-spacing: .16em;
    color: var(--purple); text-transform: uppercase;
  }

  p {
    margin: 0; font-family: "Trebuchet MS", "Avenir Next Rounded", sans-serif;
    font-size: clamp(17px, 2.4vw, 21px); line-height: 1.72;
  }
  /* オチの一言（本人の言葉） */
  .big { font-size: clamp(23px, 4vw, 34px); font-weight: 850; line-height: 1.42; color: #6d3a63;
         font-family: "Arial Rounded MT Bold", "Avenir Next Rounded", "Trebuchet MS", sans-serif; }

  /* ── タイムライン（段階を見せるとき）──────────────────── */
  .timeline { display: grid; gap: 14px; margin-top: 16px; }
  .timeline-item {
    display: grid; grid-template-columns: 160px 1fr; align-items: center; gap: 14px;
    padding: 16px 18px; border: 2px solid rgba(255,255,255,.9); border-radius: 22px;
    box-shadow: 0 7px 18px rgba(115,70,111,.07);
  }
  .timeline-item:nth-child(1) { background: #fff5c9; }
  .timeline-item:nth-child(2) { background: #e7f5ff; }
  .timeline-item:nth-child(3) { background: #f4eaff; }
  .timeline-item:nth-child(4) { background: #e6fbf4; }
  .stage  { font-weight: 900; color: #6f52ca; }
  .device { font-weight: 750; color: #49354d; }

  /* ── Next ⚡：次の記事へ直行する。ショート動画のスワイプの代わり ──── */
  .next {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    margin-top: 34px; min-height: 44px; padding: 20px 24px;
    border-radius: var(--round); text-decoration: none;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    color: #fff; box-shadow: var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .next:hover, .next:focus-visible {
    transform: translateY(-4px); box-shadow: 0 26px 60px rgba(115,70,111,.26);
  }
  .next-kicker { font-size: 11.5px; font-weight: 900; letter-spacing: .18em; opacity: .82; }
  .next-title  { margin-top: 4px; font-size: clamp(17px, 3vw, 21px); line-height: 1.3; }
  .next-arrow  { font-size: 26px; flex: 0 0 auto; }

  /* ── YouTube（iframeにしない。カードでリンク）───────────── */
  .youtube-card {
    display: block; margin-top: 28px; overflow: hidden; color: #fff; text-decoration: none;
    border: 6px solid rgba(255,255,255,.9); border-radius: 30px; background: #25152c;
    box-shadow: var(--shadow); transition: transform .2s ease, box-shadow .2s ease;
  }
  .youtube-card:hover, .youtube-card:focus-visible {
    transform: translateY(-4px) rotate(-.3deg); box-shadow: 0 25px 65px rgba(115,70,111,.24);
  }
  /* サムネが読めなくても、下地のグラデーションで崩れない */
  .youtube-thumb {
    position: relative; display: grid; min-height: 210px; place-items: center; overflow: hidden;
    background: linear-gradient(135deg, rgba(76,36,93,.78), rgba(255,111,174,.62));
  }
  .play {
    display: grid; position: relative; z-index: 1; width: 78px; height: 78px;
    place-items: center; padding-left: 5px; border-radius: 50%;
    background: #fff; color: #f04476; font-size: 34px; box-shadow: 0 10px 25px rgba(0,0,0,.24);
  }
  .youtube-footer {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 18px 18px; font-size: 16px;
  }
  .watch-button {
    display: inline-block; flex: 0 0 auto; min-height: 44px; padding: 13px 16px;
    border-radius: 999px; background: #ff4f78; color: #fff; font-size: 14px;
    box-shadow: 0 5px 0 #c9355b;
  }

  /* ════════════════════════════════════════════════════════════
     ⚡ モーションキット
     すごいアニメは作らない。「開いた瞬間に何か動いた」程度でいい。
     部品を消してもここは残しておく。CSSは触らなくていい。
     ════════════════════════════════════════════════════════════ */

  /* 1. 上のもの（ラベル・h1・写真）は開いた瞬間に一度だけ出る */
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .label { animation: rise .5s .05s both ease-out; }
  h1     { animation: rise .6s .12s both ease-out; }
  .photo { animation: rise .6s .22s both ease-out; }

  /* 2. カードはスクロールで下からふわっと出る（下の <script> が .in を付ける）
        ⚠️ .js が付いているときだけ隠す。JSが動かない環境では最初から見えている。
           こうしないと「真っ白なページ」になる */
  .js .card, .js .next {
    opacity: 0; transform: translateY(18px);
    transition: opacity .55s ease-out, transform .55s ease-out;
  }
  .js .card.in, .js .next.in { opacity: 1; transform: none; }

  /* 3. 見出しラベルはカードより少し遅れて左から入る */
  @keyframes slide-in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
  .card.in .card-label { animation: slide-in .45s .18s both ease-out; }

  /* 4. アクセント絵文字を1つだけ、ゆっくり揺らし続ける（.float を付けた要素） */
  @keyframes float { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-9px) rotate(3deg); } }
  .float { display: inline-block; animation: float 3.4s ease-in-out infinite alternate; }

  /* 5. オチだけ少し強めにポンと出る */
  @keyframes pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
  .card.in .big { animation: pop .5s .1s both cubic-bezier(.2,1.3,.4,1); }

  @media (max-width: 600px) {
    main { width: min(100% - 18px, 720px); padding-top: 16px; }
    /* 375pxでも「戻る」と2つのバッジが1行に収まるように詰める */
    .topbar { flex-wrap: nowrap; gap: 8px; }
    .badges { gap: 6px; }
    .home     { padding: 12px 13px; font-size: 13px; white-space: nowrap; }
    .wc-badge { padding: 10px 11px; font-size: 12px; white-space: nowrap; }
    .stage    { padding: 10px 10px; font-size: 10px; letter-spacing: .08em; }
    .photo, .card, .youtube-card, .next { border-radius: 23px; }
    .card { padding: 20px; }
    .timeline-item { grid-template-columns: 1fr; gap: 4px; }
    .youtube-thumb { min-height: 175px; }
    .youtube-footer { align-items: flex-start; flex-direction: column; }
  }

  /* ⚠️ 動きが苦手な人のための逃げ道。消さないこと。
     これが無いと tools/check.py が落ちる */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
<!-- JSが動く環境でだけ「隠してから出す」演出を有効にする。消さないこと -->
<script>document.documentElement.className += " js";</script>
</head>
<body>
<main>

  <div class="topbar">
    <!-- works/<slug>/ からも drafts/<slug>/ からも、リポジトリ直下の index.html に届く -->
    <a class="home" href="../../index.html">← Back</a>
    <div class="badges">
      <!-- 👇 python3 tools/check.py --fix-badge が正しい数字に直してくれる -->
      <div class="wc-badge">⚡ 0 words · 0 sec</div>
      <!-- 🚦 出す場所は1つだけ。記事はぜんぶ PUBLIC -->
      <div class="stage stage-public">PUBLIC</div>
    </div>
  </div>

  <!-- 👇 差し替える -->
  <div class="label">⚡ 15 SECOND BLOG ⚡</div>
  <h1>Title Goes Here <span class="float">🐧</span></h1>

  <!-- 写真：images/ に入れて、ここには IMAGE:ファイル名 と書くだけ。
       python3 tools/embed.py __SLUG__ が縮小してbase64に置き換える -->
  <figure class="photo">
    <img src="IMAGE:photo.jpg" alt="写真の内容を英語で説明する" />
  </figure>

  <!-- ── 本文カード：3〜5枚まで。1枚に1〜2文 ────────────────────
       <p> の中 = 本人の言葉だけ（素材から直訳。word数に入る）
       card-label = 本人の素材だけを短く整理・英訳した見出し（英単語2〜3語・word数に入らない） -->
  <section class="card">
    <div class="card-head">
      <span class="card-emoji" aria-hidden="true">🧠</span>
      <span class="card-label">The Problem</span>
    </div>
    <p>
      First sentence here.
    </p>
  </section>

  <section class="card">
    <div class="card-head">
      <span class="card-emoji" aria-hidden="true">⚡</span>
      <span class="card-label">One Fix</span>
    </div>
    <p>
      Second sentence here.
    </p>
  </section>

  <!-- 段階や流れを見せたいとき（要らなければカードごと消す） -->
  <section class="card">
    <div class="card-head">
      <span class="card-emoji" aria-hidden="true">🧭</span>
      <span class="card-label">The Order</span>
    </div>
    <div class="timeline">
      <div class="timeline-item"><div class="stage">🧸 Step one</div><div class="device">detail</div></div>
      <div class="timeline-item"><div class="stage">🎒 Step two</div><div class="device">detail</div></div>
      <div class="timeline-item"><div class="stage">🏫 Step three</div><div class="device">detail</div></div>
    </div>
  </section>

  <!-- オチの一言（本人の言葉。要らなければカードごと消す） -->
  <section class="card">
    <div class="card-head">
      <span class="card-emoji" aria-hidden="true">🎯</span>
      <span class="card-label">So What</span>
    </div>
    <p class="big">The punchline goes here. 🙂‍↕️</p>
  </section>

  <!-- ⚡ 次の記事へ。公開するときにリンク先とタイトルを埋める -->
  <a class="next" href="../__NEXT_SLUG__/index.html">
    <div>
      <div class="next-kicker">NEXT · 15 SEC</div>
      <div class="next-title">Next article title</div>
    </div>
    <div class="next-arrow" aria-hidden="true">⚡</div>
  </a>

  <!-- YouTubeがあるとき（要らなければ丸ごと消す） -->
  <!--
  <a class="youtube-card" href="https://youtu.be/XXXX" target="_blank" rel="noopener noreferrer" aria-label="Watch on YouTube">
    <div class="youtube-thumb" aria-hidden="true"><span class="play">▶</span></div>
    <div class="youtube-footer">
      <span>🐧</span>
      <span class="watch-button">▶ Watch on YouTube</span>
    </div>
  </a>
  -->

</main>

<!-- ⚡ 見えたカードに .in を付けるだけ。外部ライブラリは入れない -->
<script>
(function () {
  var items = [].slice.call(document.querySelectorAll('.card, .next'));
  function showAll() { items.forEach(function (el) { el.classList.add('in'); }); }

  if (!('IntersectionObserver' in window)) { showAll(); return; }

  var seen = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('in'); seen.unobserve(e.target); }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
  items.forEach(function (el) { seen.observe(el); });

  // 保険：何かの理由で1枚も出てこなかったら、全部見せる。
  // 演出のために本文が読めない、が絶対に起きないようにする
  setTimeout(function () {
    if (!document.querySelector('.card.in, .next.in')) showAll();
  }, 1600);
})();
</script>
</body>
</html>

<!-- SOURCE MAP
S1  → 使った（1枚目のカード）
S2  → 削った：重複

本文の英文はすべて、上のどれかのS番号から訳したものです。
S番号に対応しない英文は1つもありません。

削った文：S2
追加した文：0
整理テキスト：card-label 4個 / h1 ← 本人の素材だけを要約・英訳（word数対象外）
-->
